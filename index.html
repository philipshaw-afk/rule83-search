<style>
/* Follows the M&A Monitor integrated-site prototype (8.3 Tracker > Search Form): Inter + JetBrains Mono, glass cards, light only */
:root{
  --bg:#F5F7FB; --t:#0F1729; --t2:#4A5568; --t3:#6B7A93;
  --b:rgba(0,0,0,.07); --b2:rgba(0,0,0,.045);
  --a:#4F6EF7; --al:rgba(79,110,247,.08); --ah:#3B5AE0;
  --g:#0D9B6A; --gb:rgba(13,155,106,.09);
  --am:#B07D00; --ab:rgba(176,125,0,.09);
  --r:#DC3E1B; --rb:rgba(220,62,27,.08);
  --p:#7C5CFC; --pb:rgba(124,92,252,.08); --tl:#0D7490; --tb:rgba(13,116,144,.08);
  --in:#4338CA; --ib:rgba(67,56,202,.07);
  --ss:0 1px 3px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03);
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.86);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --pad:32px;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45;
  background-image:linear-gradient(rgba(0,0,0,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.02) 1px,transparent 1px),radial-gradient(60% 50% at 0% 0%,rgba(79,110,247,.09),transparent 65%),radial-gradient(50% 45% at 100% 100%,rgba(124,92,252,.06),transparent 65%);
  background-size:80px 80px,80px 80px,100% 100%,100% 100%;background-attachment:fixed;min-height:100vh}
a{color:var(--a);text-decoration:none}
a:hover{color:var(--ah)}
button,input,select{font:inherit}
p,h1,h2,h3,h4,dl,dd{margin:0}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}

/* header */
.hdr{background:rgba(255,255,255,.76);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-bottom:1px solid var(--b);padding-inline:var(--pad);padding-block:8px;min-height:56px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:9px;color:var(--t)}
.brand img{height:36px;width:auto;display:block}
.brand .sep,.auth-card .lg .sep{width:1px;height:24px;background:rgba(15,23,41,.14);flex:none}
.logo-t{font-weight:700;font-size:15px;letter-spacing:-.3px;color:var(--t);white-space:nowrap}
.nav{display:flex;gap:2px;flex:1;min-width:0}
.nav a{color:var(--t2);font-size:13px;font-weight:500;padding:7px 11px;border-radius:8px;white-space:nowrap}
.nav a:hover{background:rgba(0,0,0,.035);color:var(--t)}
.nav a.on{color:var(--a);background:var(--al);box-shadow:inset 0 0 0 1px rgba(79,110,247,.14)}
.who-am{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--t3)}
.who-am b{color:var(--t2);font-weight:500}
.who-am a{font-weight:600;font-size:12px}
.wrap{max-width:1440px;margin:0 auto;padding-inline:var(--pad);padding-block:26px 40px;display:flex;flex-direction:column;gap:16px}
.phd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.phd h1{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.1;background:linear-gradient(135deg,#0F1729 35%,#4F6EF7 110%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#0F1729}
.phd p{margin-top:6px;color:var(--t2);font-size:13.5px;line-height:1.5;max-width:70ch}
.dstat{font-size:11.5px;color:var(--t3);text-align:right;line-height:1.5}
.dstat b{color:var(--t2);font-family:var(--mono);font-weight:500}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--b);padding-top:14px;font-size:11.5px;color:var(--t3)}

/* cards, buttons, fields */
.card{background:var(--glass2);border:1px solid var(--b);border-radius:12px;box-shadow:var(--ss);backdrop-filter:blur(14px);overflow:hidden}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--b);background:rgba(0,0,0,.016);flex-wrap:wrap}
.card-t{font-size:12.5px;font-weight:700;letter-spacing:-.15px}
.card-s{font-size:10.5px;color:var(--t3);font-weight:500}
.card-s b{color:var(--t);font-family:var(--mono)}

// Same sign-in as the filing exceptions site (same client list); on the same web address the sign-in is shared.
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: "r83-exceptions-auth" }
});
const app = document.getElementById("app");
const S = { session: null, me: null, status: null, names: null };

// ---- helpers --------------------------------------------------------------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const byId = id => document.getElementById(id);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const two = n => String(n).padStart(2, "0");
const iso = d => `${d.getUTCFullYear()}-${two(d.getUTCMonth() + 1)}-${two(d.getUTCDate())}`;
const pd = s => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const addDays = (s, n) => { const d = pd(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const dow = s => pd(s).getUTCDay();
const fdl = s => { const d = pd(s); return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const fdm = s => { const d = pd(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const fdy = s => { const d = pd(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
function todayLondon() {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return `${g("year")}-${g("month")}-${g("day")}`;
}
// England & Wales bank holidays (for "Yesterday" = previous business day)
const BANK_HOLS = new Set(["2026-01-01","2026-04-03","2026-04-06","2026-05-04","2026-05-25","2026-08-31","2026-12-25","2026-12-28",
  "2027-01-01","2027-03-26","2027-03-29","2027-05-03","2027-05-31","2027-08-30","2027-12-27","2027-12-28"]);
const isBd = s => dow(s) % 6 !== 0 && !BANK_HOLS.has(s);
const prevBd = s => { do { s = addDays(s, -1); } while (!isBd(s)); return s; };

function friendlyError(e) {
  const m = (e && (e.message || e.error_description || e.error)) || String(e);
  if (/Invalid login credentials/i.test(m)) return "Email or password not recognised.";
  if (/rate limit|too many/i.test(m)) return "Too many attempts. Please wait a few minutes and try again.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Could not reach the server. Check your connection and try again.";
  if (/Not authorised/i.test(m)) return "This account doesn’t have access to the 8.3 search.";
  return m;
}

// ---- sign-in screens (same accounts as the filing exceptions site) -----------
function authShell(title, sub, inner, fine = "") {
  app.innerHTML = `<main class="auth"><section class="auth-card" aria-labelledby="ah">
    <div class="lg"><img src="${LOGO}" alt="M&amp;A Monitor"><i class="sep"></i><span class="logo-t">8.3 Tracker</span></div>
    <h1 id="ah">${title}</h1><p class="sub">${sub}</p>${inner}${fine ? `<p class="fine">${fine}</p>` : ""}</section></main>`;
}
function showLogin(msg) {
  authShell("8.3 Search Form", "Search Rule 8.3 dealings by company, trading company and date, with the % of share capital moved and the £ volume of each filing.",
    `<form id="lf" novalidate>
      ${msg ? `<p class="msg err" role="alert">${esc(msg)}</p>` : ""}
      <div><label class="f" for="em">Email</label><input class="inp" id="em" type="email" autocomplete="username" required></div>
      <div><label class="f" for="pw">Password</label><input class="inp" id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Sign in</button>
    </form>`,
    `Access is for M&amp;A Monitor subscribers. Forgotten your password or need access? Email <a href="mailto:${SUPPORT_EMAIL}">${SUPPORT_EMAIL}</a>.`);
  const f = byId("lf");
  byId("em").focus();
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({ email: f.em.value.trim(), password: f.pw.value });
    if (error) { showLogin(friendlyError(error)); return; }
    await boot();
  });
}
function showSetPassword(first) {
  authShell(first ? "Choose your password" : "Change password",
    first ? "Welcome. Please replace the temporary password you were given with one of your own." : `Signed in as ${esc(S.session.user.email)}.`,
    `<form id="pf" novalidate>
      <p class="msg err" id="pmsg" role="alert" hidden></p>
      <div><label class="f" for="p1">New password (at least 10 characters)</label><input class="inp" id="p1" type="password" autocomplete="new-password" minlength="10" required></div>
      <div><label class="f" for="p2">Repeat new password</label><input class="inp" id="p2" type="password" autocomplete="new-password" minlength="10" required></div>
      <button class="btn" type="submit">Save password</button>
      ${first ? "" : `<a href="#/" style="text-align:center;font-size:12px">Cancel</a>`}

const PERIODS = [["", "-- All time --"], ["today", "-- Today --"], ["yesterday", "-- Yesterday --"], ["this_week", "-- This week --"],
  ["last_week", "-- Last week --"], ["this_month", "-- This month --"], ["last_month", "-- Last month --"], ["this_year", "-- This year --"], ["last_year", "-- Last year --"]];
function periodRange(p) {
  const t = todayLondon(), [y, m] = t.split("-").map(Number);
  const mon = addDays(t, -((dow(t) + 6) % 7));
  switch (p) {
    case "today": return [t, t];
    case "yesterday": { const d = prevBd(t); return [d, d]; }
    case "this_week": return [mon, t];
    case "last_week": return [addDays(mon, -7), addDays(mon, -1)];
    case "this_month": return [`${y}-${two(m)}-01`, t];
    case "last_month": { const d = new Date(Date.UTC(y, m - 2, 1)); return [iso(d), addDays(`${y}-${two(m)}-01`, -1)]; }
    case "this_year": return [`${y}-01-01`, t];
    case "last_year": return [`${y - 1}-01-01`, `${y - 1}-12-31`];
    default: return [null, null];
  }
}

  }
  function detail(r) {
    const L = [], line = (l, mid, val, c) => L.push(`<dt>${l}</dt><dd class="m">${mid}</dd><dd class="r${c ? " " + c : ""}">${val}</dd>`);
    const d = r.dl, leg = (a, l) => { if (a) line(l, int(a[0]) + (price(a) ? " @ " + price(a) : ""), gbp(a[1])); };
    leg(d.sb, "Purchases"); leg(d.ss, "Sales"); leg(d.dl, "Derivatives · long"); leg(d.ds, "Derivatives · short");
    if (d.ti) line("Transfers in", int(d.ti), "excl.", "m");
    if (d.to) line("Transfers out", int(d.to), "excl.", "m");
    (d.op || []).forEach(o => line(esc(o[0]) + (o[1] ? " · " + esc(String(o[1]).toLowerCase()) : ""), int(o[2]) + (o[3] !== null && o[3] !== undefined && o[3] !== "" ? " @ " + esc(o[3]) : ""), "excl.", "m"));
    const deals = L.length ? `<dl class="r83-dl">${L.join("")}<div class="hr"></div><div class="tot" style="display:contents"><dt>£ volume</dt><dd class="m"></dd><dd class="r">${gbp(r.v)}</dd></div></dl>`
      : `<p>No dealings in this filing — it discloses a position only${r.tags.includes("OPENING") ? " (opening position)." : "."}</p>`;
    const n = r.net;
    const lp = r.pl === null || r.pl === undefined ? "—" : pct(Number(r.pl)).replace("0.00%", "0%");
    const sp = r.ps === null || r.ps === undefined ? "—" : pct(Number(r.ps)).replace("0.00%", "0%");
    const est = [];
    if (r.tgs === "matched") est.push("The company dealt in was worked out from the number of securities in issue, as this filing came after the last 8.3 Tracker check.");
    if (!r.tg) est.push("The company dealt in will be filled in at the next update.");
    if (r.de) est.push("Dealing date assumed to be the previous business day until the next update.");
    return `<tr class="dx" id="r83-d${r.id}"><td colspan="10"><div class="r83-dg">` +
      `<div class="r83-db"><h4>Dealings disclosed</h4>${deals}</div>` +
      `<div class="r83-db"><h4>Position after dealing</h4><div class="r83-pos"><div><div class="kv">${lp}</div><div class="kl">Long${r.lt ? " · " + int(r.lt) : ""}</div></div><div><div class="kv">${sp}</div><div class="kl">Short${r.st ? " · " + int(r.st) : ""}</div></div></div>` +
        `<p>Net movement: <b style="color:${n > 0 ? "var(--g)" : n < 0 ? "var(--r)" : "var(--t2)"}">${Math.abs(n) >= 0.005 ? (n > 0 ? "+" : "−") : ""}${pct(Math.abs(n))}</b>${r.nsi ? ` of ${int(r.nsi)} relevant securities in issue` : ""} (${esc(r.cl)}).</p>` +
        (r.cf && r.cf.toUpperCase() !== String(r.cl || "").toUpperCase() ? `<p class="muted" style="font-size:11px;color:var(--t3)">Class as filed: ${esc(r.cf)}</p>` : "") + `</div>` +
      `<div class="r83-db"><h4>Filing</h4><p>${esc(title(r.tc))} · ${esc(r.ty)}<br>Dealt in ${r.tg ? esc(title(r.tg)) : "<i>not yet identified</i>"}${r.dd ? ` on ${fdl(r.dd)}${r.de ? " (assumed)" : ""}` : ""}<br>Announced ${esc(r.at || "")} on ${fdl(r.ad)} · RNS ID ${r.id}</p>` +
        (r.n ? `<div class="nt"><b>M&amp;A Monitor note:</b> ${esc(r.n.charAt(0) + r.n.slice(1).toLowerCase())}</div>` : "") +
        (est.length ? `<div class="est">${est.join(" ")}</div>` : "") +
        `<div class="r83-lk"><a class="btn sm" href="${view(r.id)}" target="_blank" rel="noopener">View Form 8.3 ↗</a><a class="btn ghost sm" href="${esc(history(r))}" target="_blank" rel="noopener">Trading record ↗</a>` +
        `${r.tg ? `<button type="button" class="btn ghost sm" data-q="${esc(r.tg)}">All filings in ${esc(title(r.tg))}</button>` : ""}<button type="button" class="btn ghost sm" data-qt="${esc(r.tc)}">All filings by ${esc(title(r.tc))}</button></div></div>` +
      `</div></td></tr>`;
  }

  function draw() {
    if (!byId("r83-t")) return;
    drawTypes();
    LIST = sorted(ROWS.filter(r => pass(r)));
    kpis(LIST);
    const vis = LIST.slice(0, F.shown);
    const empty = !ROWS.length ? emptyMsg() : `<b>No filings match these filters</b>Try a lower % or £ threshold, or another trading company type.`;
    byId("r83-t").innerHTML = head() + "<tbody>" + (vis.length ? vis.map(row).join("") : `<tr><td colspan="10"><div class="r83-empty">${empty}</div></td></tr>`) + "</tbody>";
    byId("r83-n").textContent = LIST.length.toLocaleString("en-GB");
    const more = LIST.length - vis.length; byId("r83-more").hidden = more <= 0;
    byId("r83-morebtn").textContent = `Show ${Math.min(PAGE, more)} more · ${more.toLocaleString("en-GB")} remaining`;
    const f = []; if (F.types.size) f.push([...F.types].join(", "));
    if (num(F.pct)) f.push(`${F.measure === "net" ? "Net" : "Gross"} ≥ ${num(F.pct)}%`);
    if (num(F.vol)) f.push(`≥ £${num(F.vol)}m`);
    if (F.dir !== "all") f.push(F.dir === "buy" ? "Net buyers" : "Net sellers");
    if (F.deal) f.push("Dealings only");
    if (F.nw) f.push("New shareholders");
    byId("r83-sum").innerHTML = `Showing <b>${vis.length.toLocaleString("en-GB")}</b> of <b>${LIST.length.toLocaleString("en-GB")}</b>` + (f.length ? " · " + esc(f.join(" · ")) : ASK ? " · " + esc(ASK.sub.toLowerCase()) : "");
    byId("r83-reset").disabled = !f.length;
    document.querySelectorAll(".r83-q").forEach(q => { const cur = num(byId(q.dataset.q).value); q.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(num(b.dataset.v) === cur))); });
    note();
  }
  function emptyMsg() {
    const st = S.status, t = todayLondon();
    if (ASK && ASK.adPeriod === "today" && st && st.latest && st.latest < t && !ASK.q)
      return `<b>No filings loaded for today yet</b>The latest filings are from ${fdl(st.latest)}.<br><button type="button" class="btn sm" id="r83-latest">Show ${fdl(st.latest)}</button>`;
    return `<b>No filings match this search</b>Check the spelling of the company names, or widen the dates.`;
  }
  function note() {
    const est = ROWS.filter(r => r.tgs === "matched" || !r.tg || r.de).length;
    byId("r83-note").innerHTML =
      `<p><b>% of share capital</b> = securities bought and sold in the filing (shares, derivatives and options; transfers are not counted) as a percentage of the relevant securities in issue; <b>Net</b> = bought − sold, <b>Gross</b> = bought + sold. ` +
      `<b>£ volume</b> = value of share purchases and sales plus the notional value of CFD / swap dealings at the disclosed prices, converted to sterling at the 8.3 Tracker’s GBP prices. Transfers and option premiums are excluded. ` +
      `<b>NEW</b> = a first disclosure, or dealings that took the holder from under 1% to 1% or more.</p>` +
      (TOTAL > ROWS.length ? `<p><b>Only the ${ROWS.length.toLocaleString("en-GB")} largest filings by £ volume are shown</b> out of ${TOTAL.toLocaleString("en-GB")} that match the search. Narrow the dates or add a company to see them all.</p>` : "") +
      (est ? `<p><b>${est} filing${est === 1 ? "" : "s"}</b> made after the last 8.3 Tracker check ${est === 1 ? "has its" : "have their"} company worked out from the securities in issue and dealing date assumed to be the previous business day; ${est === 1 ? "it is" : "they are"} confirmed at the next update.</p>` : "");
  }

  // ---- the search form (server) ----
  function readForm() {
    const val = id => (byId(id).value || "").trim();
    // one choice between dealing date and announcement date, as on the 8.3 Tracker
    const by = (document.querySelector('input[name="dt"]:checked') || {}).value || "ad-p";
    const none = [null, null];
    const ad = by === "ad-p" ? periodRange(byId("ad-sel").value) : by === "ad-r" ? [val("ad-from") || null, val("ad-to") || null] : none;
    const dd = by === "dd-p" ? periodRange(byId("dd-sel").value) : by === "dd-r" ? [val("dd-from") || null, val("dd-to") || null] : none;
    const cls = (document.querySelector('input[name="cls"]:checked') || {}).value || "all";
    const q = { tg: val("r-dealt"), tc: val("r-trader"), ad, dd, cls,
      by: by[0] === "d" ? "dealt" : "announced",
      adPeriod: by === "ad-p" ? byId("ad-sel").value : null, ddPeriod: by === "dd-p" ? byId("dd-sel").value : null };
    q.q = q.tg || q.tc;
    return q;
  }
  function describe(q) {
    const span = ([a, b]) => !a && !b ? "" : a && b ? (a === b ? fdl(a) : `${fdy(a)} – ${fdy(b)}`) : a ? `from ${fdy(a)}` : `to ${fdy(b)}`;
    const parts = [];
    const rng = q.by === "dealt" ? q.dd : q.ad, per = q.by === "dealt" ? q.ddPeriod : q.adPeriod, Verb = q.by === "dealt" ? "Dealt" : "Announced";
    const when = rng[0] || rng[1] ? (per && PERIOD_WORDS[per] ? PERIOD_WORDS[per] + (rng[0] === rng[1] ? ", " + fdl(rng[0]) : "") : span(rng)) : "";
    parts.push(when ? `${Verb} ${when}` : "All dates");
    if (q.tg) parts.push(`dealt in “${q.tg}”`);
    if (q.tc) parts.push(`trader “${q.tc}”`);
    if (q.cls !== "all") parts.push(q.cls === "ord" ? "ordinaries" : "other classes");
    const sub = q.q ? "Form 8.3s matching the search" : !when ? "Form 8.3s, all dates"
      : `Form 8.3s ${q.by} ${per && PERIOD_WORDS[per] ? PERIOD_WORDS[per] : "in the period"}`;
    return { head: parts.join(" · "), sub };
  }
  async function run() {
    const q = readForm(), me = ++SEQ;
    const d = describe(q); q.sub = d.sub;
    const st = S.status;
    byId("r83-asof").textContent = "· " + d.head + (st && st.asof ? ` · 8.3 Tracker data to ${st.asofShort}` : "");
    const btn = byId("r83-go"); btn.disabled = true; btn.textContent = "Searching…";
    root().classList.add("busy");
    try {
      const { data, error } = await sb.rpc("r83_search", {
        p_dealt_in: q.tg || null, p_trader: q.tc || null, p_ann_from: q.ad[0], p_ann_to: q.ad[1],
        p_deal_from: q.dd[0], p_deal_to: q.dd[1], p_class: q.cls, p_limit: ROW_LIMIT });
      if (me !== SEQ) return;                                  // a newer search has started
      if (error) throw error;
      ASK = q; ROWS = prep(data.rows || []); TOTAL = data.total || 0;
      const days = new Set(ROWS.map(r => r.ad)); SINGLE_DAY = days.size <= 1;
      const cnt = {}; ROWS.forEach(r => cnt[r.ty] = (cnt[r.ty] || 0) + 1);
      TYPES = Object.keys(cnt).sort((a, b) => (a === "Unclassified") - (b === "Unclassified") || cnt[b] - cnt[a]);
      F.types = new Set([...F.types].filter(t => cnt[t])); F.shown = PAGE; F.open.clear();
      draw();
    } catch (e) {
      if (me !== SEQ) return;
      if (/JWT|session|401/i.test(String(e && e.message))) { await signOut(); return; }
      byId("r83-t").innerHTML = `<tbody><tr><td><div class="r83-empty"><b>The search didn’t work</b>${esc(friendlyError(e))}</div></td></tr></tbody>`;
    } finally {
      if (me === SEQ) { btn.disabled = false; btn.textContent = "Search"; root() && root().classList.remove("busy"); }
    }
  }
  function searchFor(field, value) {
    byId("r-dealt").value = field === "tg" ? value : "";
    byId("r-trader").value = field === "tc" ? value : "";
    run(); byId("sf").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function init() {
    F = S0(); ROWS = []; TOTAL = 0; ASK = null;
    const r = root(), scr = byId("r83-t").parentElement;
    const setW = () => { if (scr.clientWidth) r.style.setProperty("--r83w", scr.clientWidth + "px"); };
    if (window.ResizeObserver) new ResizeObserver(setW).observe(scr); else addEventListener("resize", setW);
    // names for the type-ahead
    if (S.names) fillNames(); else sb.rpc("r83_names").then(({ data }) => { if (data) { S.names = data; fillNames(); } });
    // search form
    byId("sf").addEventListener("submit", e => { e.preventDefault(); run(); });
    // using a period list or a date box ticks its own option (dealing date OR announcement date, never both)
    [["dd-sel", "dd-p"], ["ad-sel", "ad-p"], ["dd-from", "dd-r"], ["dd-to", "dd-r"], ["ad-from", "ad-r"], ["ad-to", "ad-r"]].forEach(([f, r]) =>
      ["mousedown", "change", "input"].forEach(ev => byId(f).addEventListener(ev, () => { byId(r).checked = true; })));
    // results
    byId("r83-types").addEventListener("change", e => { const i = e.target; if (i.hasAttribute("data-all")) F.types.clear(); else if (i.checked) F.types.add(i.value); else F.types.delete(i.value); F.shown = PAGE; draw(); });
    byId("r83-t").addEventListener("click", e => {
      const th = e.target.closest("th[data-k]");
      if (th) { const k = th.dataset.k; if (F.key === k) F.asc = !F.asc; else { F.key = k; F.asc = ["tc", "ty", "tg"].includes(k); } draw(); return; }
      const qb = e.target.closest("[data-q],[data-qt]");
      if (qb) { e.preventDefault(); qb.dataset.q !== undefined ? searchFor("tg", qb.dataset.q) : searchFor("tc", qb.dataset.qt); return; }
      if (e.target.closest("#r83-latest")) { const d = S.status.latest; byId("ad-r").checked = true; byId("ad-from").value = d; byId("ad-to").value = d; run(); return; }
      if (e.target.closest("a")) return;
      const tr = e.target.closest("tr.rw"); if (!tr) return;
      const id = +tr.dataset.id; F.open.has(id) ? F.open.delete(id) : F.open.add(id); draw();
      const b = byId("r83-t").querySelector(`tr.rw[data-id="${id}"] .r83-cx`); if (b && e.target.closest(".r83-cx")) b.focus();
    });
    const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
    ["r83-pct", "r83-vol"].forEach(id => byId(id).addEventListener("input", debounce(e => { F[id === "r83-pct" ? "pct" : "vol"] = e.target.value; F.shown = PAGE; draw(); }, 200)));
    document.querySelectorAll(".r83-q").forEach(q => q.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
      byId(q.dataset.q).value = b.dataset.v; F[q.dataset.q === "r83-pct" ? "pct" : "vol"] = b.dataset.v; F.shown = PAGE; draw(); }));
    document.querySelectorAll("input[name=r83m]").forEach(i => i.addEventListener("change", () => { F.measure = i.value; F.shown = PAGE; draw(); }));
    document.querySelectorAll("input[name=r83d]").forEach(i => i.addEventListener("change", () => { F.dir = i.value; F.shown = PAGE; draw(); }));
    byId("r83-deal").addEventListener("change", e => { F.deal = e.target.checked; F.shown = PAGE; draw(); });
    byId("r83-new").addEventListener("change", e => { F.nw = e.target.checked; F.shown = PAGE; draw(); });
    byId("r83-morebtn").addEventListener("click", () => { F.shown += PAGE; draw(); });
    byId("r83-reset").addEventListener("click", () => {
      Object.assign(F, { types: new Set(), measure: "net", pct: "", vol: "", dir: "all", deal: false, nw: false, shown: PAGE });
      byId("r83-pct").value = ""; byId("r83-vol").value = ""; byId("r83-deal").checked = false; byId("r83-new").checked = false;
      r.querySelector("input[name=r83m][value=net]").checked = true; r.querySelector("input[name=r83d][value=all]").checked = true;
      draw();
    });
    byId("r83-csv").addEventListener("click", csv);
    run();
  }
  function fillNames() {
    const o = a => (a || []).map(n => `<option value="${esc(n)}">`).join("");
    if (byId("dl-tg")) byId("dl-tg").innerHTML = o(S.names.targets);
    if (byId("dl-tc")) byId("dl-tc").innerHTML = o(S.names.traders);
  }
  function csv() {
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`, f4 = x => (Number(x) || 0).toFixed(4);
    const lines = [["Announced", "Time", "Dealing date", "Trading company", "Company type", "Company dealt in", "Class of relevant security",
      "Bought % of share capital", "Sold % of share capital", "Net %", "GBP volume", "Long % after dealing", "Short % after dealing", "Tags", "M&A notes", "RNS ID", "Form 8.3"].map(q).join(",")]
      .concat(LIST.map(r => [r.ad, r.at, r.dd ? r.dd + (r.de ? " (assumed)" : "") : "", r.tc, r.ty, r.tg || "", r.cl, f4(r.b), f4(r.s), f4(r.net), (r.v || 0).toFixed(2),
        r.pl ?? "", r.ps ?? "", r.tags.join(" "), r.n || "", r.id, view(r.id)].map(q).join(",")));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv" }));
    const d = ASK && ASK.ad[0] ? ASK.ad[0].replace(/-/g, "") + (ASK.ad[1] && ASK.ad[1] !== ASK.ad[0] ? "-" + ASK.ad[1].replace(/-/g, "") : "") : "search";
    a.download = `8.3_dealings_${d}.csv`; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  return { init, run };
})();

// ---- routing ---------------------------------------------------------------------
async function loadStatus() {
  const { data, error } = await sb.from("r83_search_days").select("ann_date, export_taken, uploaded_at").order("ann_date", { ascending: false });
  if (error) throw error;
  const rows = data || [];
  const latest = rows[0];
  const asof = latest && latest.export_taken ? latest.export_taken : "";
  const m = /(\d\d)\/(\d\d)\/(\d{4})\s+(\d\d:\d\d)/.exec(asof);
  S.status = { latest: latest ? latest.ann_date : null, first: rows.length ? rows[rows.length - 1].ann_date : null,
    asof: m ? `${m[4]} ${fdl(`${m[3]}-${m[2]}-${m[1]}`)}` : asof, asofShort: m ? (`${m[3]}-${m[2]}-${m[1]}` === todayLondon() ? m[4] : `${m[4]} on ${fdm(`${m[3]}-${m[2]}-${m[1]}`)}`) : asof };
}
async function route() {
  if (!S.session) return showLogin();
  if (!S.me || !S.me.active) return showNoAccess();
  if (S.me.must_change_password) return showSetPassword(true);
  const h = location.hash.replace(/^#\/?/, "");
  try {
    if (h === "password") return showSetPassword(false);
    if (!S.status) await loadStatus();
    pageSearch();
  } catch (e) {
    if (/JWT|session|401/i.test(String(e && e.message))) { await signOut(); return; }
    app.innerHTML = `<main class="wrap"><p class="note err"><b>Something went wrong loading the page.</b> ${esc(friendlyError(e))} <a href="#/" onclick="location.reload()">Try again</a></p></main>`;
  }
}
async function boot() {
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if (!S.session) return showLogin();
  const email = (S.session.user.email || "").toLowerCase();
  const { data: me, error } = await sb.from("clients").select("*").eq("email", email).maybeSingle();
  if (error) { showLogin(friendlyError(error)); return; }
  S.me = me;
  await route();
}
window.addEventListener("hashchange", () => { if (S.session) route(); });
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "SIGNED_OUT") { S.session = null; S.me = null; showLogin(); }
  else if (session) S.session = session;
});
boot();
</script>
</body>
